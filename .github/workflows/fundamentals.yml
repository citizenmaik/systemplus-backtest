name: fundamentals

on:
  schedule:
    - cron: "11 5 * * 6"   # Samstag 05:11 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: SEC EDGAR companyfacts
        working-directory: scripts
        run: python fundamentals.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.parquet data/fundamentals_info.json
          if git diff --cached --quiet; then echo "Keine Änderungen"; else
            git commit -m "data: fundamentals $(date -u +%F)"; git pull --rebase; git push; fi
