name: v42-report

on:
  schedule:
    - cron: "13 9 * * 0"   # Sonntag 09:13 UTC, nach dem Vollaufbau (06:43 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: V4.2-Bericht rechnen
        run: python backtest/v42_report.py
      - name: Seite rendern
        run: python backtest/report/render_report.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backtest/out/v42_report.json backtest/report/v42_trades.html
          if git diff --cached --quiet; then echo "Keine Änderungen"; else
            git commit -m "report: V4.2 $(date -u +%F)"; git pull --rebase; git push; fi
