name: update-data

on:
  schedule:
    # Zeiten in UTC. 22:17 UTC = 00:17 Berlin (Sommerzeit) – nach US-Schluss
    - cron: "17 22 * * 1-5"   # Mo–Fr: inkrementell
    - cron: "43 6 * * 0"      # Sonntag: Vollaufbau + Metadaten
  workflow_dispatch:
    inputs:
      mode:
        description: "full = komplett neu aufbauen, incremental = letzter Monat"
        type: choice
        options: [incremental, full]
        default: incremental

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Modus bestimmen
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 6 * * 0" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: Kursdaten
        working-directory: scripts
        run: python update.py --mode ${{ steps.mode.outputs.mode }}

      - name: Metadaten (Sektor, Float)
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        working-directory: scripts
        run: python meta.py --max 1500

      - name: Datenprüfung
        working-directory: scripts
        run: python quality.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data universe
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "data: ${{ steps.mode.outputs.mode }} $(date -u +%F)"
            git pull --rebase
            git push
          fi
