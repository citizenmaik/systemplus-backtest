name: earnings

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml
      - name: Earnings-Termine und T-Bill-Zins
        working-directory: scripts
        run: python earnings.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/earnings.csv data/irx.csv
          if git diff --cached --quiet; then echo "Keine Änderungen"; else
            git commit -m "data: earnings + irx $(date -u +%F)"; git pull --rebase; git push; fi
